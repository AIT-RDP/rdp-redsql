name: redsql
channels:
  - defaults
dependencies:
  - python=3.10
  - pyyaml=6.0
  - sqlalchemy=2.0.37
  - pytest=8.3.4  # Not needed for productive use
  - pandas=2.2.3  # Recommended for productive use
  - pydantic=2.10.3
  - pip=24.2
  - pip:
      # Providing the token for the pyrdp-commons repo. Please avoid such constructs when switching to poetry.
      - --extra-index-url https://gitlab-intern.ait.ac.at/api/v4/projects/3611/packages/pypi/simple
      - redis==4.3
      - hiredis==2.0
      - psycopg2-binary==2.9.3  # The conda non-binary installation triggers an import error
      - prometheus-client==0.14.1
      - versioneer==0.22  # Not needed for productive use
      - pyrdp-commons==0.0.0.post77.dev0+5b64a2b
